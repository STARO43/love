<!DOCTYPE html>
<html lang="ru">
<head>
 <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16/09/2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    user-select: none;
    perspective: 1000px;
  }

  /* Фоновый слой — всегда снизу */
  #bg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
  }
  #bg span {
    font-weight: 700;
    text-align: center;
    line-height: 0.95;
    letter-spacing: -0.03em;
    padding: 0 5vw;
    word-wrap: break-word;
  }

  /* Слой осколков — поверх всего */
  #shards {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    transform-style: preserve-3d;
  }

  .shard {
    position: absolute;
    top: 0;
    left: 0;
    background-repeat: no-repeat;
    backface-visibility: hidden;
    pointer-events: none;
  }

  /* Фирменный минималистичный маркер в углу */
  #signature {
    position: fixed;
    top: 30px;
    left: 30px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    font-weight: bold;
    z-index: 50;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #signature::before {
    content: '';
    display: block;
    width: 10px;
    height: 10px;
    background: currentColor;
  }

  /* Подсказка в стиле технической маркировки */
  #hint {
    position: fixed;
    bottom: 30px;
    right: 30px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="shards"></div>
<div id="signature">16/09/2026</div>
<div id="hint">Любовь моя</div>

<script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
<script>
// ============================================================
//  НАСТРОЙКИ СЛОЁВ (Палитра и типографика в стиле САЛ)
// ============================================================
const layers = [
  { bg: '#ffffff', text: 'Тебе тридцать пять,', color: '#000000' },
  { bg: '#000000', text: 'или сколько там лет?', color: '#ffffff' },
  { bg: '#e31e24', text: 'Ну вот.', color: '#ffffff' },
  { bg: '#ffffff', text: 'Интересно,', color: '#000000' },
  { bg: '#000000', text: 'счастлива? Нет?', color: '#ffffff' },
  { bg: '#f2f2f2', text: 'Да ну.', color: '#e31e24' },
  { bg: '#000000', text: 'Может важно вовсе не то?', color: '#ffffff' },
  { bg: '#ffffff', text: 'Родилась же когда-то.', color: '#000000' },
  { bg: '#e31e24', text: 'А теперь — наше всё! ♡', color: '#ffffff' },
];

// ============================================================
//  ПАРАМЕТРЫ ЭФФЕКТА (НЕ ИЗМЕНЕНЫ)
// ============================================================
const SHARD_COUNT = 40;      
const POINT_SPREAD = 0.75;   
const FADE_SPEED = 0.012;    
const GRAVITY = 0.25;
const ROT_DAMPING = 0.985;   

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
let currentLayer = 0;
let busy = false;
let lastTime = 0;
const bgEl = document.getElementById('bg');
const shardsEl = document.getElementById('shards');
const shards = [];

// ============================================================
//  РЕНДЕР СЛОЯ В CANVAS
// ============================================================
function renderLayerCanvas(index) {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const L = layers[index % layers.length];

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = L.bg;
  ctx.fillRect(0, 0, W, H);

  const fontSize = Math.min(W * 0.12, H * 0.22);
  ctx.fillStyle = L.color;
  ctx.font = `700 ${fontSize}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(L.text, W / 2, H / 2);

  return { canvas, W, H, L };
}

// ============================================================
//  УСТАНОВКА ФОНА
// ============================================================
function setBackground(index) {
  const L = layers[index % layers.length];
  const W = window.innerWidth;
  const H = window.innerHeight;

  bgEl.style.background = L.bg;
  bgEl.innerHTML = '';

  const fontSize = Math.min(W * 0.12, H * 0.22);
  const span = document.createElement('span');
  span.textContent = L.text;
  span.style.fontSize = fontSize + 'px';
  span.style.color = L.color;
  bgEl.appendChild(span);

  // Автоматическая адаптация цвета мета-элементов для идеального контраста
  const isLightBg = (L.bg === '#ffffff' || L.bg === '#f2f2f2');
  const contrastColor = isLightBg ? '#000000' : '#ffffff';
  
  document.getElementById('signature').style.color = contrastColor;
  document.getElementById('hint').style.color = contrastColor;
}

// ============================================================
//  ТРИАНГУЛЯЦИЯ (с неравномерным распределением)
// ============================================================
function triangulate(cx, cy, W, H) {
  const points = [];
  const maxR = Math.max(W, H) * 0.7;

  for (let i = 0; i < SHARD_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 1 + POINT_SPREAD) * maxR;
    let x = cx + Math.cos(angle) * r;
    let y = cy + Math.sin(angle) * r;
    x = Math.max(-100, Math.min(W + 100, x));
    y = Math.max(-100, Math.min(H + 100, y));
    points.push(x, y);
  }

  points.push(-100, -100, W + 100, -100, -100, H + 100, W + 100, H + 100);
  points.push(cx, cy);

  const d = new Delaunator(new Float64Array(points));
  return { points, triangles: d.triangles };
}

// ============================================================
//  НАРЕЗКА ОСКОЛКА В ОТДЕЛЬНЫЙ CANVAS
// ============================================================
function cutShard(sourceCanvas, p0, p1, p2) {
  const minX = Math.min(p0.x, p1.x, p2.x);
  const minY = Math.min(p0.y, p1.y, p2.y);
  const maxX = Math.max(p0.x, p1.x, p2.x);
  const maxY = Math.max(p0.y, p1.y, p2.y);
  const w = Math.ceil(maxX - minX);
  const h = Math.ceil(maxY - minY);

  if (w < 8 || h < 8) return null;

  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');

  const lx0 = p0.x - minX, ly0 = p0.y - minY;
  const lx1 = p1.x - minX, ly1 = p1.y - minY;
  const lx2 = p2.x - minX, ly2 = p2.y - minY;

  ctx.beginPath();
  ctx.moveTo(lx0, ly0);
  ctx.lineTo(lx1, ly1);
  ctx.lineTo(lx2, ly2);
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(sourceCanvas, minX, minY, w, h, 0, 0, w, h);

  return { canvas: c, minX, minY, w, h };
}

// ============================================================
//  СОЗДАНИЕ ОСКОЛКОВ
// ============================================================
function createShards(cx, cy) {
  const { canvas, W, H } = renderLayerCanvas(currentLayer);
  const { points, triangles } = triangulate(cx, cy, W, H);

  for (let i = 0; i < triangles.length; i += 3) {
    const i0 = triangles[i] * 2;
    const i1 = triangles[i + 1] * 2;
    const i2 = triangles[i + 2] * 2;

    const p0 = { x: points[i0],     y: points[i0 + 1] };
    const p1 = { x: points[i1],     y: points[i1 + 1] };
    const p2 = { x: points[i2],     y: points[i2 + 1] };

    const cut = cutShard(canvas, p0, p1, p2);
    if (!cut) continue;

    const mx = (p0.x + p1.x + p2.x) / 3;
    const my = (p0.y + p1.y + p2.y) / 3;

    const div = document.createElement('div');
    div.className = 'shard';
    div.style.width = cut.w + 'px';
    div.style.height = cut.h + 'px';
    div.style.backgroundImage = `url(${cut.canvas.toDataURL()})`;
    div.style.backgroundSize = `${cut.w}px ${cut.h}px`;
    div.style.transform = `translate3d(${cut.minX}px, ${cut.minY}px, 0)`;

    shardsEl.appendChild(div);

    const dx = mx - cx;
    const dy = my - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const speed = 1.5 + Math.random() * 3;

    shards.push({
      el: div,
      baseX: cut.minX,
      baseY: cut.minY,
      x: 0, y: 0, z: 0,
      vx: (dx / dist) * speed + (Math.random() - 0.5) * 2,
      vy: (dy / dist) * speed + (Math.random() - 0.5) * 2 - 1,
      vz: 30 + Math.random() * 80,
      rx: 0, ry: 0, rz: 0,
      vrx: (Math.random() - 0.5) * 0.15,
      vry: (Math.random() - 0.5) * 0.15,
      vrz: (Math.random() - 0.5) * 0.1,
      opacity: 1,
    });
  }
}

// ============================================================
//  АНИМАЦИЯ
// ============================================================
function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min((t - lastTime) / 16, 2);
  lastTime = t;

  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];

    s.vy += GRAVITY * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;
    s.vz *= 0.96;

    s.rx += s.vrx * dt;
    s.ry += s.vry * dt;
    s.rz += s.vrz * dt;
    s.vrx *= ROT_DAMPING;
    s.vry *= ROT_DAMPING;
    s.vrz *= ROT_DAMPING;

    s.opacity -= (FADE_SPEED * (0.7 + Math.random() * 0.6)) * dt;

    s.el.style.transform =
      `translate3d(${s.baseX + s.x}px, ${s.baseY + s.y}px, ${s.z}px) ` +
      `rotateX(${s.rx}rad) rotateY(${s.ry}rad) rotateZ(${s.rz}rad)`;
    s.el.style.opacity = Math.max(0, s.opacity);

    if (s.opacity <= 0) {
      s.el.remove();
      shards.splice(i, 1);
    }
  }
}

// ============================================================
//  КЛИК
// ============================================================
function onClick(e) {
  if (busy) return;
  busy = true;
  setTimeout(() => busy = false, 350);

  const cx = e.clientX;
  const cy = e.clientY;

  createShards(cx, cy);

  currentLayer = (currentLayer + 1) % layers.length;
  setBackground(currentLayer);
}

document.addEventListener('click', onClick);
document.addEventListener('touchstart', (e) => {
  e.preventDefault();
  onClick(e.touches[0]);
}, { passive: false });

window.addEventListener('resize', () => {
  setBackground(currentLayer);
});

// ============================================================
//  СТАРТ
// ============================================================
setBackground(0);
requestAnimationFrame(animate);
</script>
</body>
</html>
