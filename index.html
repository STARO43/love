<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>160926</title>
<style>
  @font-face {
  font-family: 'Unbounded';
  font-weight: 900;
  font-display: block;
  src: url('Unbounded-Black.ttf') format('truetype');
}
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
<script>
const layers = [
  { bg: 0xffffff, text: 'Тебе тридцать пять,',      color: '#000000' },
  { bg: 0x000000, text: 'или сколько там лет?',     color: '#ffffff' },
  { bg: 0xe31e24, text: 'Ну вот.',                  color: '#ffffff' },
  { bg: 0xffffff, text: 'Интересно,',               color: '#000000' },
  { bg: 0x000000, text: 'счастлива? Нет?',          color: '#ffffff' },
  { bg: 0xf2f2f2, text: 'Да ну.',                   color: '#e31e24' },
  { bg: 0x000000, text: 'Может важно вовсе не то?', color: '#ffffff' },
  { bg: 0xffffff, text: 'Родилась же когда-то.',    color: '#000000' },
  { bg: 0xe31e24, text: 'А теперь — наше всё! ♡',   color: '#ffffff' },
];

const TWO_PI = 2 * Math.PI;

let imageWidth  = window.innerWidth;
let imageHeight = window.innerHeight;
let cameraStart = 3.5 * imageHeight;

let scene, camera, renderer, group;
let layerIndex = 0;
let clicks = 0;
let cursor = 0;
let clickPosition = [imageWidth / 2, imageHeight / 2];
let vertices = [];
let indices = [];
let activeShards = [];
let busy = false;
let lastClick = 0;

function randomRange(a, b) { return a + (b - a) * Math.random(); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function easeCubicIn(t)  { return t * t * t; }
function easeCubicOut(t) { return 1 - Math.pow(1 - t, 3); }

function getRandomWallDepth() {
  return Math.floor(500 * Math.random()) + 100;
}

function randomPastelColor() {
  return Math.floor(Math.random() * 0x1000000);
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const fov = 2 * Math.atan(imageHeight / (2 * cameraStart)) * (180 / Math.PI);
  camera = new THREE.PerspectiveCamera(fov, imageWidth / imageHeight, 1, 20000);
  camera.position.set(0, 0, cameraStart);
  scene.add(camera);

  const light = new THREE.PointLight(0xffffff, 1);
  camera.add(light);

  group = new THREE.Group();
  group.position.set(-0.5 * imageWidth, -0.5 * imageHeight, 0);
  scene.add(group);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(imageWidth, imageHeight);
  document.body.appendChild(renderer.domElement);

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('resize', onWindowResize, false);

  makeBox();
  makeBox();

  animate();
}

function fitFontSize(ctx, layer, baseSize) {
  const maxWidth = imageWidth * 0.85;
  let size = baseSize;
  while (size > 10) {
    const font = '900 ' + size + "px 'Unbounded', sans-serif";
    ctx.font = font;

    const words = layer.text.split(' ');
    const lines = [];
    let line = '';
    let tooWide = false;

    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (ctx.measureText(w).width > maxWidth) { tooWide = true; break; }
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = w;
      } else line = test;
    }
    if (line) lines.push(line);

    if (!tooWide) {
      let ok = true;
      for (let i = 0; i < lines.length; i++) {
        if (ctx.measureText(lines[i]).width > maxWidth) { ok = false; break; }
      }
      const totalHeight = lines.length * size * 1.2;
      if (totalHeight > imageHeight * 0.8) ok = false;
      if (ok) return { size: size, lines: lines, font: font };
    }
    size -= 2;
  }
  return { size: size, lines: [layer.text], font: '900 ' + size + "px 'Unbounded', sans-serif" };
}

function makeCanvasTexture(layer) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width  = Math.round(imageWidth  * dpr);
  c.height = Math.round(imageHeight * dpr);
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);

  const hex = '#' + layer.bg.toString(16).padStart(6, '0');
  ctx.fillStyle = hex;
  ctx.fillRect(0, 0, imageWidth, imageHeight);

  const baseSize = Math.min(imageWidth * 0.12, imageHeight * 0.2);
  const fit = fitFontSize(ctx, layer, baseSize);

  ctx.fillStyle = layer.color;
  ctx.font = fit.font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const lh = fit.size * 1.2;
  const startY = imageHeight / 2 - (fit.lines.length - 1) * lh / 2;
  for (let i = 0; i < fit.lines.length; i++) {
    ctx.fillText(fit.lines[i], imageWidth / 2, startY + i * lh);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

function makeEmptyTexture(bgColor) {
  const c = document.createElement('canvas');
  c.width = 2;
  c.height = 2;
  const ctx = c.getContext('2d');
  const hex = '#' + bgColor.toString(16).padStart(6, '0');
  ctx.fillStyle = hex;
  ctx.fillRect(0, 0, 2, 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

function makeBox() {
  const depth = getRandomWallDepth();
  let layer, tex, sideColor;

  if (layerIndex < layers.length) {
    layer = layers[layerIndex];
    tex = makeCanvasTexture(layer);
    sideColor = new THREE.Color(layer.bg).multiplyScalar(0.82);
  } else {
    const bg = randomPastelColor();
    layer = { bg: bg };
    tex = makeEmptyTexture(bg);
    sideColor = new THREE.Color(bg).multiplyScalar(0.82);
  }

  const geo = new THREE.BoxGeometry(imageWidth, imageHeight, depth);
  const sideMat = new THREE.MeshPhongMaterial({ color: sideColor });
  const mats = [
    sideMat,
    sideMat,
    sideMat,
    sideMat,
    new THREE.MeshBasicMaterial({ map: tex }),
    sideMat,
  ];
  const box = new THREE.Mesh(geo, mats);

  cursor -= depth;
  box.position.z = cursor;
  box.name = 'box';
  box.userData.depth = depth;
  box.userData.layer = layerIndex;
  box.userData.texture = tex;
  box.userData.sideMat = sideMat;
  box.userData.isWall = true;
  scene.add(box);

  layerIndex++;

  const walls = [];
  scene.traverse(function (obj) {
    if (obj.userData && obj.userData.isWall) walls.push(obj);
  });
  walls.sort(function (a, b) { return b.position.z - a.position.z; });
  if (walls.length > 0) {
    tweenCameraTo(cameraStart + walls[0].position.z, 0.35, easeCubicOut);
  }
}

function tweenCameraTo(targetZ, duration, ease) {
  const startZ = camera.position.z;
  const t0 = performance.now();
  const ms = duration * 1000;
  function step() {
    const t = Math.min((performance.now() - t0) / ms, 1);
    camera.position.z = startZ + (targetZ - startZ) * ease(t);
    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

function onPointerDown(e) {
  if (e.pointerType === 'touch' && e.isPrimary === false) return;
  const now = performance.now();
  if (busy || now - lastClick < 150) return;
  busy = true;
  lastClick = now;
  setTimeout(function () { busy = false; }, 150);

  clickPosition[0] = e.clientX;
  clickPosition[1] = imageHeight - e.clientY;

  triangulate();
  shatter();

  makeBox();
}

function onWindowResize() {
  imageWidth  = window.innerWidth;
  imageHeight = window.innerHeight;
  cameraStart = 3.5 * imageHeight;
  camera.aspect = imageWidth / imageHeight;
  camera.fov = 2 * Math.atan(imageHeight / (2 * cameraStart)) * (180 / Math.PI);
  camera.updateProjectionMatrix();
  group.position.x = -0.5 * imageWidth;
  group.position.y = -0.5 * imageHeight;
  renderer.setSize(imageWidth, imageHeight);
}

function triangulate() {
  vertices = [];
  const rings = [
    { r: imageWidth / 12, c: 12 },
    { r: imageWidth / 8,  c: 12 },
    { r: imageWidth / 4,  c: 12 },
    { r: imageWidth,      c: 12 },
  ];
  const cx = clickPosition[0];
  const cy = clickPosition[1];
  vertices.push([cx, cy]);

  for (let ri = 0; ri < rings.length; ri++) {
    const ring = rings[ri];
    const spread = 0.25 * ring.r;
    for (let h = 0; h < ring.c; h++) {
      const x = Math.cos(h / ring.c * TWO_PI) * ring.r + cx + randomRange(-spread, spread);
      const y = Math.sin(h / ring.c * TWO_PI) * ring.r + cy + randomRange(-spread, spread);
      vertices.push([x, y]);
    }
  }

  for (let i = 0; i < vertices.length; i++) {
    vertices[i][0] = clamp(vertices[i][0], 0, imageWidth);
    vertices[i][1] = clamp(vertices[i][1], 0, imageHeight);
  }

  const flat = new Float64Array(vertices.length * 2);
  for (let i = 0; i < vertices.length; i++) {
    flat[i * 2]     = vertices[i][0];
    flat[i * 2 + 1] = vertices[i][1];
  }
  const d = new Delaunator(flat);
  indices = Array.prototype.slice.call(d.triangles);
}

function shatter() {
  let frontBox = null;
  let frontZ = -Infinity;
  scene.traverse(function (obj) {
    if (obj.userData && obj.userData.isWall && obj.position.z > frontZ) {
      frontZ = obj.position.z;
      frontBox = obj;
    }
  });
  if (!frontBox) return;

  const depth = frontBox.userData.depth;
  const tex = frontBox.userData.texture;

  scene.remove(frontBox);
  frontBox.geometry.dispose();
  const oldMats = Array.isArray(frontBox.material) ? frontBox.material : [frontBox.material];
  for (let i = 0; i < oldMats.length; i++) oldMats[i].dispose();

  let sideColor;
  if (frontBox.userData.layer < layers.length) {
    sideColor = new THREE.Color(layers[frontBox.userData.layer].bg).multiplyScalar(0.82);
  } else {
    sideColor = new THREE.Color(randomPastelColor()).multiplyScalar(0.82);
  }

  const batch = {
    tex: tex,
    frontMat: new THREE.MeshBasicMaterial({ map: tex }),
    sideMat: new THREE.MeshPhongMaterial({ color: sideColor }),
    count: 0,
  };

  const extrudeOpts = {
    depth: depth,
    bevelEnabled: false,
    bevelSegments: 1,
    steps: 1,
    bevelSize: 0,
    bevelThickness: 0,
  };

  const dur = 420;
  const zBase = frontZ - depth / 2;

  for (let o = 0; o < indices.length; o += 3) {
    const A = vertices[indices[o]];
    const B = vertices[indices[o + 1]];
    const C = vertices[indices[o + 2]];

    const shape = new THREE.Shape();
    shape.moveTo(A[0], A[1]);
    shape.lineTo(B[0], B[1]);
    shape.lineTo(C[0], C[1]);
    shape.closePath();

    let geo;
    try {
      geo = new THREE.ExtrudeGeometry(shape, extrudeOpts);
    } catch (err) { continue; }

    const pos = geo.attributes.position;
    const uvArr = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) {
      uvArr[i * 2]     = pos.getX(i) / imageWidth;
      uvArr[i * 2 + 1] = pos.getY(i) / imageHeight;
    }
    geo.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));

    const mesh = new THREE.Mesh(geo, [batch.frontMat, batch.sideMat]);
    mesh.position.set(0, 0, zBase);
    group.add(mesh);

    const cx = (A[0] + B[0] + C[0]) / 3;
    const cy = (A[1] + B[1] + C[1]) / 3;
    const dx = cx - clickPosition[0];
    const dy = cy - clickPosition[1];
    const p = Math.sqrt(dx * dx + dy * dy);

    const delay = 0.0012 * p * randomRange(0.9, 1.1);

    batch.count++;
    activeShards.push({
      mesh: mesh,
      startY: mesh.position.y,
      t0: performance.now() + delay * 1000,
      dur: dur,
      batch: batch,
    });
  }

  vertices = [];
  indices = [];
}

function updateShards() {
  const now = performance.now();
  for (let i = activeShards.length - 1; i >= 0; i--) {
    const s = activeShards[i];
    const t = (now - s.t0) / s.dur;
    if (t < 0) continue;
    const e = easeCubicIn(Math.min(t, 1));
    s.mesh.position.y = s.startY - 3000 * e;
    if (t >= 1) {
      group.remove(s.mesh);
      s.mesh.geometry.dispose();
      activeShards.splice(i, 1);
      s.batch.count--;
      if (s.batch.count === 0) {
        s.batch.tex.dispose();
        s.batch.frontMat.dispose();
        s.batch.sideMat.dispose();
      }
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  updateShards();
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
