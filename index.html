<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>16/09/2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    background: #ffffff;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  #bg {
    position: fixed;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
  }

  #bg span {
    font-weight: 700;
    text-align: center;
    line-height: 0.95;
    letter-spacing: -0.03em;
    padding: 0 5vw;
    word-wrap: break-word;
  }

  #shards {
    position: fixed;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    z-index: 10;
    pointer-events: none;
    overflow: hidden;
  }

  #shards.desktop {
    perspective: 1400px;
    transform-style: preserve-3d;
  }

  .shard {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    transform-origin: center center;
  }

  .shard.anim {
    will-change: transform, opacity;
  }
</style>
</head>

<body>

<div id="bg" aria-hidden="true"></div>
<div id="shards" aria-hidden="true"></div>

<script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
<script>
const layers = [
  { bg: '#ffffff', text: 'Тебе тридцать пять,',       color: '#000000' },
  { bg: '#000000', text: 'или сколько там лет?',      color: '#ffffff' },
  { bg: '#e31e24', text: 'Ну вот.',                   color: '#ffffff' },
  { bg: '#ffffff', text: 'Интересно,',                color: '#000000' },
  { bg: '#000000', text: 'счастлива? Нет?',           color: '#ffffff' },
  { bg: '#f2f2f2', text: 'Да ну.',                    color: '#e31e24' },
  { bg: '#000000', text: 'Может важно вовсе не то?',  color: '#ffffff' },
  { bg: '#ffffff', text: 'Родилась же когда-то.',     color: '#000000' },
  { bg: '#e31e24', text: 'А теперь — наше всё! ♡',    color: '#ffffff' },
];

const isMobile = /Android|iPhone|iPad|iPod|Mobile|Opera Mini/i.test(navigator.userAgent)
              || window.innerWidth < 700
              || ('ontouchstart' in window && window.innerWidth < 1024);

const ENABLE_3D   = !isMobile;
const MAX_DPR     = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.75);

const SHARD_COUNT  = isMobile ? 22 : 34;
const POINT_SPREAD = isMobile ? 0.85 : 0.6;

const GRAVITY        = isMobile ? 1 : 1;
const GRAVITY_DELAY  = isMobile ? 110  : 160;
const IMPULSE        = isMobile ? 1.6  : 1.9;
const IMPULSE_RAND   = isMobile ? 2.2  : 2.6;
const FRICTION       = 0.986;
const Z_FRICTION     = 0.965;
const ROT_SPEED      = isMobile ? 0.06 : 0.11;
const ROT_DAMPING    = 0.988;
const FADE_SPEED     = isMobile ? 0.016 : 0.009;
const SCALE_FADE     = true;

const LOCK_MS        = isMobile ? 450 : 300;
const MIN_GAP_MS     = isMobile ? 350 : 180;
const MAX_SHARDS     = isMobile ? 130 : 240;

let currentLayer   = 0;
let busy           = false;
let lastActionTime = 0;
let lastTime       = 0;
let running        = false;

const bgEl     = document.getElementById('bg');
const shardsEl = document.getElementById('shards');
const shards   = [];

if (ENABLE_3D) shardsEl.classList.add('desktop');

let bgSpan = document.createElement('span');
bgSpan.setAttribute('aria-hidden', 'true');
bgEl.appendChild(bgSpan);

function setBackground(index) {
  const L = layers[index % layers.length];
  const W = window.innerWidth;
  const H = window.innerHeight;

  bgEl.style.background = L.bg;
  document.body.style.background = L.bg;
  document.documentElement.style.background = L.bg;

  const fontSize = Math.min(W * 0.12, H * 0.22);
  bgSpan.textContent = L.text;
  bgSpan.style.fontSize = fontSize + 'px';
  bgSpan.style.color = L.color;
}

function renderLayerCanvas(index) {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const L = layers[index % layers.length];

  const canvas = document.createElement('canvas');
  canvas.width  = Math.floor(W * MAX_DPR);
  canvas.height = Math.floor(H * MAX_DPR);
  const ctx = canvas.getContext('2d');
  ctx.scale(MAX_DPR, MAX_DPR);

  ctx.fillStyle = L.bg;
  ctx.fillRect(0, 0, W, H);

  const fontSize = Math.min(W * 0.12, H * 0.22);
  ctx.fillStyle = L.color;
  ctx.font = `700 ${fontSize}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(L.text, W / 2, H / 2);

  return { canvas };
}

function triangulate(cx, cy, W, H) {
  const points = [];
  const maxR = Math.max(W, H) * 0.7;

  for (let i = 0; i < SHARD_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 1 + POINT_SPREAD) * maxR;
    let x = cx + Math.cos(angle) * r;
    let y = cy + Math.sin(angle) * r;
    x = Math.max(-100, Math.min(W + 100, x));
    y = Math.max(-100, Math.min(H + 100, y));
    points.push(x, y);
  }

  points.push(-100, -100, W + 100, -100, -100, H + 100, W + 100, H + 100);
  points.push(cx, cy);

  const d = new Delaunator(new Float64Array(points));
  return { points, triangles: d.triangles };
}

function cutShard(sourceCanvas, p0, p1, p2) {
  const minX = Math.min(p0.x, p1.x, p2.x);
  const minY = Math.min(p0.y, p1.y, p2.y);
  const maxX = Math.max(p0.x, p1.x, p2.x);
  const maxY = Math.max(p0.y, p1.y, p2.y);
  const w = Math.ceil(maxX - minX);
  const h = Math.ceil(maxY - minY);

  if (w < 6 || h < 6) return null;

  const dpr = MAX_DPR;
  const c = document.createElement('canvas');
  c.width  = Math.ceil(w * dpr);
  c.height = Math.ceil(h * dpr);

  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);

  const lx0 = p0.x - minX, ly0 = p0.y - minY;
  const lx1 = p1.x - minX, ly1 = p1.y - minY;
  const lx2 = p2.x - minX, ly2 = p2.y - minY;

  ctx.beginPath();
  ctx.moveTo(lx0, ly0);
  ctx.lineTo(lx1, ly1);
  ctx.lineTo(lx2, ly2);
  ctx.closePath();
  ctx.clip();

  ctx.drawImage(
    sourceCanvas,
    0, 0, sourceCanvas.width, sourceCanvas.height,
    0, 0, window.innerWidth, window.innerHeight
  );

  return { canvas: c, minX, minY, w, h };
}

function createShards(cx, cy) {
  if (shards.length > MAX_SHARDS) return;

  const { canvas } = renderLayerCanvas(currentLayer);
  const W = window.innerWidth;
  const H = window.innerHeight;
  const { points, triangles } = triangulate(cx, cy, W, H);

  const maxDist = Math.hypot(W, H) * 0.5;
  const rnd = (range) => (Math.random() - 0.5) * range;

  for (let i = 0; i < triangles.length; i += 3) {
    const i0 = triangles[i] * 2;
    const i1 = triangles[i + 1] * 2;
    const i2 = triangles[i + 2] * 2;

    const p0 = { x: points[i0],     y: points[i0 + 1] };
    const p1 = { x: points[i1],     y: points[i1 + 1] };
    const p2 = { x: points[i2],     y: points[i2 + 1] };

    const cut = cutShard(canvas, p0, p1, p2);
    if (!cut) continue;

    const mx = (p0.x + p1.x + p2.x) / 3;
    const my = (p0.y + p1.y + p2.y) / 3;

    const div = document.createElement('div');
    div.className = 'shard anim';
    div.style.width  = cut.w + 'px';
    div.style.height = cut.h + 'px';

    cut.canvas.style.display = 'block';
    cut.canvas.style.width   = cut.w + 'px';
    cut.canvas.style.height  = cut.h + 'px';
    div.appendChild(cut.canvas);
    div.style.transform = `translate(${cut.minX}px, ${cut.minY}px)`;

    shardsEl.appendChild(div);

    const dx = mx - cx;
    const dy = my - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / dist;
    const ny = dy / dist;

    const distFactor = 1 - Math.min(dist / maxDist, 1);
    const speed = IMPULSE + Math.random() * IMPULSE_RAND + distFactor * 0.6;

    const area = cut.w * cut.h;
    const sizeK = Math.min(area / 4000, 2.5);

    shards.push({
      el: div,
      baseX: cut.minX,
      baseY: cut.minY,

      x: 0, y: 0, z: 0,
      vx: nx * speed + rnd(1.2),
      vy: ny * speed - (0.7 + Math.random() * 1.0) / (0.7 + sizeK * 0.4) + rnd(1.2),
      vz: ENABLE_3D ? (10 + Math.random() * 55) : 0,

      rx: 0, ry: 0, rz: 0,
      vrx: ENABLE_3D ? rnd(ROT_SPEED * 2) : 0,
      vry: ENABLE_3D ? rnd(ROT_SPEED * 2) : 0,
      vrz: rnd(ROT_SPEED * 1.2),

      opacity: 1,
      scale: 1,
      age: 0,
    });
  }

  startLoop();
}

function animate(t) {
  const dtMs = Math.min(t - lastTime, 34);
  const dt = dtMs / 16;
  lastTime = t;

  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.age += dtMs;

    if (s.age > GRAVITY_DELAY) s.vy += GRAVITY * dt;

    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.z += s.vz * dt;

    s.vx *= FRICTION;
    s.vy *= FRICTION;
    if (ENABLE_3D) s.vz *= Z_FRICTION;

    if (ENABLE_3D) {
      s.rx += s.vrx * dt;
      s.ry += s.vry * dt;
      s.vrx *= ROT_DAMPING;
      s.vry *= ROT_DAMPING;
    }
    s.rz += s.vrz * dt;
    s.vrz *= ROT_DAMPING;

    s.opacity -= FADE_SPEED * dt;

    if (SCALE_FADE) {
      const o = s.opacity > 0 ? s.opacity : 0;
      s.scale = 1 - (1 - o) * 0.08;
    }

    const tx = s.baseX + s.x;
    const ty = s.baseY + s.y;

    let transform;
    if (ENABLE_3D) {
      transform =
        `translate3d(${tx.toFixed(2)}px, ${ty.toFixed(2)}px, ${s.z.toFixed(1)}px) ` +
        `rotateX(${s.rx.toFixed(3)}rad) rotateY(${s.ry.toFixed(3)}rad) ` +
        `rotateZ(${s.rz.toFixed(3)}rad) scale(${s.scale.toFixed(3)})`;
    } else {
      transform =
        `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) ` +
        `rotate(${s.rz.toFixed(3)}rad) scale(${s.scale.toFixed(3)})`;
    }

    s.el.style.transform = transform;
    s.el.style.opacity = s.opacity < 1 ? s.opacity.toFixed(3) : 1;

    if (s.opacity <= 0) {
      s.el.classList.remove('anim');
      s.el.remove();
      shards.splice(i, 1);
    }
  }

  if (shards.length > 0) {
    requestAnimationFrame(animate);
  } else {
    running = false;
  }
}

function startLoop() {
  if (running) return;
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(animate);
}

function trigger(x, y) {
  const now = performance.now();
  if (busy) return;
  if (now - lastActionTime < MIN_GAP_MS) return;

  busy = true;
  lastActionTime = now;
  setTimeout(() => { busy = false; }, LOCK_MS);

  createShards(x, y);

  currentLayer = (currentLayer + 1) % layers.length;
  setBackground(currentLayer);
}

document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' && e.isPrimary === false) return;
  trigger(e.clientX, e.clientY);
}, { passive: true });

if (!window.PointerEvent) {
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    trigger(t.clientX, t.clientY);
  }, { passive: true });

  document.addEventListener('mousedown', (e) => {
    trigger(e.clientX, e.clientY);
  });
}

document.addEventListener('contextmenu', (e) => e.preventDefault());

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => setBackground(currentLayer), 150);
});

setBackground(0);
</script>
</body>
</html>
