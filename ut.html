<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Зайчиха</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 24px;
        }

        .audio-btn {
            width: min(70vw, 260px);
            height: min(70vw, 260px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .audio-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }

        .audio-btn .icon {
            font-size: 44px;
            line-height: 1;
        }

        .audio-btn .subtitle {
            font-size: 14px;
            letter-spacing: 0.5px;
            opacity: 0.6;
            text-align: center;
            padding: 0 16px;
        }

        .audio-btn.playing {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.55);
        }

        .audio-btn.playing .subtitle { opacity: 1; }

        .audio-btn .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .audio-btn.playing .dot {
            opacity: 1;
            animation: dotPulse 1.5s infinite ease-in-out;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.4); }
        }

        @media (max-height: 700px) {
            .audio-btn { width: min(50vw, 160px); height: min(50vw, 160px); }
            .audio-btn .icon { font-size: 32px; }
            .audio-btn .subtitle { font-size: 12px; }
            body { gap: 18px; }
        }
    </style>
</head>
<body>
    <button class="audio-btn" id="btn1" type="button">
        <span class="icon">▶</span>
        <span class="subtitle">Стихи</span>
        <span class="dot"></span>
    </button>

    <button class="audio-btn" id="btn2" type="button">
        <span class="icon">▶</span>
        <span class="subtitle">Диалог</span>
        <span class="dot"></span>
    </button>

    <audio id="audio1" src="1.mp3" preload="metadata" playsinline webkit-playsinline></audio>
    <audio id="audio2" src="2.mp3" preload="metadata" playsinline webkit-playsinline></audio>

    <script>
        (function () {
            const audio1 = document.getElementById('audio1');
            const audio2 = document.getElementById('audio2');
            const btn1   = document.getElementById('btn1');
            const btn2   = document.getElementById('btn2');

            // Разблокировка аудио на iOS — только в первом касании
            let unlocked = false;
            function unlockAudio() {
                if (unlocked) return;
                unlocked = true;
                [audio1, audio2].forEach(a => {
                    try {
                        a.load();
                        const p = a.play();
                        if (p && p.then) {
                            p.then(() => { a.pause(); a.currentTime = 0; })
                             .catch(() => {});
                        } else {
                            a.pause(); a.currentTime = 0;
                        }
                    } catch (e) {}
                });
            }

            function resetOtherAudio(except) {
                [audio1, audio2].forEach(a => {
                    if (a !== except) {
                        a.pause();
                        a.currentTime = 0;
                    }
                });
                [btn1, btn2].forEach(b => {
                    const own = b === btn1 ? audio1 : audio2;
                    if (own !== except) b.classList.remove('playing');
                });
            }

            function playOrPause(audio, btn) {
                unlockAudio();

                if (audio.paused) {
                    resetOtherAudio(audio);
                    if (audio.readyState === 0) audio.load();
                    const p = audio.play();
                    if (p && p.then) {
                        p.then(() => btn.classList.add('playing'))
                         .catch(err => {
                             console.warn('Не удалось воспроизвести:', err);
                             btn.classList.remove('playing');
                         });
                    } else {
                        btn.classList.add('playing');
                    }
                } else {
                    audio.pause();
                    btn.classList.remove('playing');
                }
            }

            // Только click — надёжно работает на iOS для <button>
            btn1.addEventListener('click', () => playOrPause(audio1, btn1));
            btn2.addEventListener('click', () => playOrPause(audio2, btn2));

            // Разблокировка отдельно, без переключения play/pause
            btn1.addEventListener('touchend', unlockAudio, { passive: true });
            btn2.addEventListener('touchend', unlockAudio, { passive: true });

            // Сброс состояния кнопок
            [audio1, audio2].forEach((audio, i) => {
                const btn = i === 0 ? btn1 : btn2;
                audio.addEventListener('ended', () => btn.classList.remove('playing'));
                audio.addEventListener('pause', () => {
                    if (audio.currentTime === 0 || audio.ended) {
                        btn.classList.remove('playing');
                    }
                });
                audio.addEventListener('error', () => {
                    console.error('Ошибка загрузки аудио ' + (i + 1), audio.error);
                    btn.classList.remove('playing');
                });
            });
        })();
    </script>
</body>
</html>
