<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Озвучка для утренника</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 24px;
        }

        .audio-btn {
            width: min(70vw, 260px);
            height: min(70vw, 260px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .audio-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.12);
        }

        .audio-btn .icon {
            font-size: 44px;
            line-height: 1;
        }

        .audio-btn .subtitle {
            font-size: 14px;
            letter-spacing: 0.5px;
            opacity: 0.6;
            text-align: center;
            padding: 0 16px;
        }

        .audio-btn.playing {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.55);
        }

        .audio-btn.playing .subtitle { opacity: 1; }

        .audio-btn .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .audio-btn.playing .dot {
            opacity: 1;
            animation: dotPulse 1.5s infinite ease-in-out;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50%      { opacity: 1;   transform: scale(1.4); }
        }
    </style>
</head>
<body>
    <button class="audio-btn" id="btn1" type="button">
        <span class="icon">▶</span>
        <span class="subtitle">Озвучка 1</span>
        <span class="dot"></span>
    </button>

    <button class="audio-btn" id="btn2" type="button">
        <span class="icon">▶</span>
        <span class="subtitle">Озвучка 2</span>
        <span class="dot"></span>
    </button>

    <!-- Атрибуты для iOS: playsinline, webkit-playsinline; preload=metadata -->
    <audio id="audio1" src="1.mp3" preload="metadata" playsinline webkit-playsinline></audio>
    <audio id="audio2" src="2.mp3" preload="metadata" playsinline webkit-playsinline></audio>

    <script>
        (function () {
            const audio1 = document.getElementById('audio1');
            const audio2 = document.getElementById('audio2');
            const btn1   = document.getElementById('btn1');
            const btn2   = document.getElementById('btn2');

            // Разблокировка аудио на iOS: один "тихий" play/pause в первом жесте
            let unlocked = false;
            function unlockAudio() {
                if (unlocked) return;
                unlocked = true;
                [audio1, audio2].forEach(a => {
                    try {
                        a.load();
                        const p = a.play();
                        if (p && p.then) {
                            p.then(() => { a.pause(); a.currentTime = 0; })
                             .catch(() => { a.pause(); a.currentTime = 0; });
                        } else {
                            a.pause(); a.currentTime = 0;
                        }
                    } catch (e) { /* тихо игнорируем */ }
                });
            }

            function resetOtherAudio(except) {
                [audio1, audio2].forEach(a => {
                    if (a !== except) {
                        a.pause();
                        a.currentTime = 0;
                    }
                });
                [btn1, btn2].forEach(b => {
                    const own = b === btn1 ? audio1 : audio2;
                    if (own !== except) b.classList.remove('playing');
                });
            }

            function playOrPause(audio, btn) {
                // Жест пользователя — разблокируем звук
                unlockAudio();

                if (audio.paused) {
                    resetOtherAudio(audio);
                    // iOS иногда требует load() перед первым play()
                    if (audio.readyState === 0) audio.load();
                    const playPromise = audio.play();
                    if (playPromise && playPromise.then) {
                        playPromise
                            .then(() => btn.classList.add('playing'))
                            .catch(err => {
                                console.warn('Не удалось воспроизвести:', err);
                                btn.classList.remove('playing');
                            });
                    } else {
                        btn.classList.add('playing');
                    }
                } else {
                    audio.pause();
                    btn.classList.remove('playing');
                }
            }

            // Обработчики: и click, и touchend — чтобы iOS точно поймал жест
            function bindButton(btn, audio) {
                let touched = false;

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    touched = true;
                    playOrPause(audio, btn);
                    setTimeout(() => { touched = false; }, 400);
                }, { passive: false });

                btn.addEventListener('click', (e) => {
                    // Если touchend уже обработал — не дублируем
                    if (touched) return;
                    playOrPause(audio, btn);
                });
            }

            bindButton(btn1, audio1);
            bindButton(btn2, audio2);

            // Сброс состояния кнопок
            [audio1, audio2].forEach((audio, i) => {
                const btn = i === 0 ? btn1 : btn2;
                audio.addEventListener('ended', () => btn.classList.remove('playing'));
                audio.addEventListener('pause', () => {
                    if (audio.currentTime === 0 || audio.ended) {
                        btn.classList.remove('playing');
                    }
                });
                audio.addEventListener('error', (e) => {
                    console.error('Ошибка загрузки аудио ' + (i + 1) + ':', audio.error);
                    btn.classList.remove('playing');
                });
            });
        })();
    </script>
</body>
</html>
